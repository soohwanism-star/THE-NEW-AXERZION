<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="app.webmanifest">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>Black Eye</title>
  <style>
    :root { color-scheme:dark; --page:#171717; --page-2:#222; --text:#f4f4f4; --muted:#a6a6a6; --faint:#777; --edge:rgba(255,255,255,.16); --glass:rgba(255,255,255,.075); --glass-hover:rgba(255,255,255,.14); --user:#303030; --shadow:rgba(0,0,0,.28); --surface:#242424; --on-surface:#ececec; }
    :root[data-theme="light"] { color-scheme:light; --page:#f7f7f5; --page-2:#e8e8e5; --text:#171717; --muted:#656565; --faint:#858585; --edge:rgba(0,0,0,.13); --glass:rgba(255,255,255,.58); --glass-hover:rgba(255,255,255,.82); --user:#ececea; --shadow:rgba(0,0,0,.12); }
    * { box-sizing:border-box; } html,body { height:100%; } body { margin:0; overflow:hidden; color:var(--text); font:15px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:radial-gradient(ellipse 65% 48% at 5% 0%,rgba(255,255,255,.08),transparent 62%),radial-gradient(ellipse 45% 55% at 98% 95%,rgba(255,255,255,.045),transparent 64%),var(--page); }
    :root[data-theme="light"] body { background:radial-gradient(ellipse 66% 48% at 3% 0%,#fff,transparent 64%),radial-gradient(ellipse 55% 55% at 98% 96%,#dfdfdc,transparent 66%),var(--page); }
    button,input,textarea { font:inherit; } button { border:0; cursor:pointer; color:inherit; } .app { display:grid; grid-template-columns:260px minmax(0,1fr); height:100dvh; padding:10px; gap:10px; }
    .glass { background:var(--glass); border:1px solid var(--edge); box-shadow:inset 1px 1px 0 rgba(255,255,255,.14),inset -1px -1px 0 rgba(0,0,0,.05),0 10px 30px var(--shadow); backdrop-filter:blur(25px) saturate(180%); -webkit-backdrop-filter:blur(25px) saturate(180%); }
    aside { min-height:0; border-radius:20px; display:flex; flex-direction:column; padding:12px; gap:12px; } .brand { display:flex; align-items:center; gap:9px; padding:7px 8px 2px; font-weight:700; letter-spacing:-.25px; } .brand-mark { width:21px; height:21px; border-radius:7px; background:linear-gradient(145deg,#fff,#a6a6a6); box-shadow:inset 1px 1px #fff8,0 3px 12px #0003; } :root[data-theme="light"] .brand-mark { background:linear-gradient(145deg,#111,#4d4d4d); }
    .icon-button,.row-button,.new-chat { background:transparent; border-radius:12px; transition:background .18s ease,transform .18s ease; } .icon-button:hover,.row-button:hover { background:var(--glass-hover); } .new-chat { padding:10px 11px; text-align:left; background:rgba(255,255,255,.16); border:1px solid var(--edge); font-weight:600; } .new-chat:hover { background:rgba(255,255,255,.25); transform:translateY(-1px); }
    .history { flex:1; overflow:auto; display:flex; flex-direction:column; gap:3px; padding-top:2px; } .history button { color:var(--text); padding:9px 10px; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .history button.active { background:var(--glass-hover); }
    .sidebar-bottom { border-top:1px solid var(--edge); padding-top:10px; display:grid; gap:3px; } .row-button { padding:8px 9px; text-align:left; color:var(--muted); } .row-button span { display:inline-block; width:25px; color:var(--text); } .privacy { color:var(--faint); font-size:11px; padding:8px 9px 0; }
    main { min-width:0; min-height:0; display:grid; grid-template-rows:auto minmax(0,1fr) auto; } header { margin-bottom:8px; min-height:49px; border-radius:17px; display:flex; align-items:center; justify-content:space-between; padding:7px 9px 7px 17px; } .title { font-weight:650; letter-spacing:-.15px; } .model { display:block; color:var(--muted); font-size:11px; font-weight:400; } .tools { display:flex; gap:3px; } .icon-button { width:34px; height:34px; display:grid; place-items:center; color:var(--muted); font-size:16px; }
    #chat { width:min(820px,100%); margin:auto; padding:20px 22px 26px; overflow-y:auto; } .empty { min-height:100%; display:grid; place-content:center; text-align:center; padding-bottom:8vh; } .empty h1 { font-size:clamp(28px,4vw,39px); letter-spacing:-1.3px; margin:0 0 8px; } .empty p { margin:0; color:var(--muted); } .assistant-orb { width:58px; height:58px; margin:0 auto 16px; display:grid; place-items:center; border:1px solid var(--edge); border-radius:22px; color:var(--page); font-weight:800; background:linear-gradient(145deg,#fff,#a9a9a9); box-shadow:inset 1px 1px #fff,0 9px 22px var(--shadow); } :root[data-theme="light"] .assistant-orb { background:linear-gradient(145deg,#282828,#050505); color:#fff; } .suggestions { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; max-width:510px; margin:25px auto 0; text-align:left; } .suggestion { min-height:66px; padding:11px 13px; color:var(--text); text-align:left; border:1px solid var(--edge); border-radius:17px; background:var(--glass); box-shadow:inset 1px 1px 0 rgba(255,255,255,.1); backdrop-filter:blur(18px) saturate(150%); } .suggestion:hover { background:var(--glass-hover); } .suggestion small { display:block; color:var(--muted); margin-top:2px; }
    .message { display:flex; align-items:flex-start; gap:12px; margin:0 0 23px; } .message.user { flex-direction:row-reverse; } .avatar { flex:0 0 28px; width:28px; height:28px; display:grid; place-items:center; border-radius:9px; font-size:11px; font-weight:700; background:var(--glass); border:1px solid var(--edge); } .user .avatar { background:var(--text); color:var(--page); } .bubble { max-width:min(680px,84%); padding:10px 13px; white-space:pre-wrap; overflow-wrap:anywhere; } .assistant .bubble { padding:5px 3px; } .user .bubble { border-radius:18px 5px 18px 18px; background:var(--user); border:1px solid var(--edge); box-shadow:0 5px 17px var(--shadow); } .typing { color:var(--muted); font-style:italic; }
    .composer-zone { padding:8px 0 max(11px,env(safe-area-inset-bottom)); } .composer { width:min(820px,calc(100% - 44px)); margin:auto; padding:7px 7px 7px 14px; border-radius:19px; display:flex; align-items:flex-end; gap:8px; } textarea { flex:1; min-height:28px; max-height:170px; resize:none; border:0; outline:0; padding:5px 0; background:transparent; color:var(--text); line-height:1.45; } textarea::placeholder { color:var(--faint); } .send { flex:0 0 35px; width:35px; height:35px; border-radius:12px; background:var(--text); color:var(--page); font-size:18px; font-weight:700; transition:transform .18s ease; } .send:hover { transform:scale(1.04); } .hint { width:min(820px,calc(100% - 44px)); margin:6px auto 0; color:var(--faint); text-align:center; font-size:11px; }
    dialog { width:min(450px,calc(100% - 28px)); color:var(--text); border:1px solid var(--edge); border-radius:22px; padding:22px; background:color-mix(in srgb,var(--page) 60%,transparent); box-shadow:0 22px 70px #0007; backdrop-filter:blur(28px) saturate(180%); -webkit-backdrop-filter:blur(28px) saturate(180%); } dialog::backdrop { background:#0005; backdrop-filter:blur(3px); } dialog h2 { font-size:19px; margin:0 0 5px; } dialog p { margin:0; color:var(--muted); font-size:13px; } label { display:block; color:var(--muted); font-size:12px; margin:16px 0 6px; } input { width:100%; padding:11px 12px; border:1px solid var(--edge); border-radius:12px; background:var(--glass); color:var(--text); outline:0; } input:focus { border-color:color-mix(in srgb,var(--text) 55%,transparent); } .dialog-actions { display:flex; justify-content:flex-end; gap:7px; margin-top:20px; } .plain { padding:9px 12px; border-radius:11px; background:transparent; color:var(--muted); } .solid { padding:9px 14px; border-radius:11px; background:var(--text); color:var(--page); font-weight:650; } .bottom-nav { display:none; } .mobile-history-list { display:grid; gap:4px; max-height:55dvh; overflow:auto; margin:16px 0 2px; } .mobile-history-list button { color:var(--text); padding:11px 12px; border-radius:13px; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; background:var(--glass); } .mobile-history-list button.active { background:var(--glass-hover); }
    @media (max-width:720px) { .app { display:block; padding:0; } aside { display:none; } main { height:100dvh; grid-template-rows:auto minmax(0,1fr) auto auto; } header { margin:8px 9px 0; border-radius:16px; } #chat { padding:19px 16px; } .composer { width:calc(100% - 18px); } .hint { width:calc(100% - 18px); } .empty { padding-bottom:8vh; } .bubble { max-width:88%; } .mobile-new,.mobile-history-toggle { display:grid; } .suggestions { max-width:340px; } .bottom-nav { display:flex; justify-content:space-around; gap:5px; margin:0 9px max(7px,env(safe-area-inset-bottom)); padding:6px; border-radius:19px; } .nav-item { min-width:70px; padding:6px 12px; border-radius:14px; color:var(--muted); background:transparent; font-size:11px; } .nav-item i { display:block; font-style:normal; font-size:18px; line-height:20px; } .nav-item.active { background:var(--glass-hover); color:var(--text); } #historyDialog { width:calc(100% - 18px); margin:0 9px 9px; padding:20px; border-radius:24px 24px 18px 18px; } #historyDialog::backdrop { background:#0004; } } @media (min-width:721px) { .mobile-new,.mobile-history-toggle { display:none; } }
  </style>
</head>
<body>
  <div class="app">
    <aside class="glass">
      <div class="brand"><span class="brand-mark"></span><span>Black Eye</span></div>
      <button class="new-chat" id="newChat">＋ 새 대화</button>
      <nav class="history" id="history" aria-label="대화 기록"></nav>
      <div class="sidebar-bottom">
        <button class="row-button" id="settings"><span>⚙</span>AI 설정</button>
        <button class="row-button" id="clearAll"><span>⌫</span>모든 대화 삭제</button>
        <div class="privacy">API 키와 대화 기록은 이 브라우저에만 저장됩니다.</div>
      </div>
    </aside>
    <main>
      <header class="glass"><div><div class="title" id="title">새 대화</div><span class="model">google/gemma-4-31b-it</span></div><div class="tools"><button class="icon-button mobile-history-toggle" id="historyToggle" aria-label="대화 기록" title="대화 기록">☰</button><button class="icon-button mobile-new" id="mobileNew" aria-label="새 대화">＋</button><button class="icon-button" id="themeToggle" aria-label="테마 전환" title="테마 전환">◐</button><button class="icon-button" id="mobileSettings" aria-label="AI 설정" title="AI 설정">⚙</button></div></header>
      <section id="chat" aria-live="polite"></section>
      <div class="composer-zone"><form class="composer glass" id="form"><textarea id="prompt" rows="1" placeholder="무엇이든 물어보세요"></textarea><button class="send" id="send" aria-label="보내기">↑</button></form><div class="hint">Black Eye는 실수할 수 있습니다. 중요한 정보는 확인하세요.</div></div>
      <nav class="bottom-nav glass" aria-label="앱 탐색"><button class="nav-item active"><i>◉</i>채팅</button><button class="nav-item" id="bottomNew"><i>＋</i>새 대화</button><button class="nav-item" id="bottomSettings"><i>⚙</i>설정</button></nav>
    </main>
  </div>
  <dialog id="keyDialog"><h2>AI 설정</h2><p>키는 이 기기의 브라우저에만 저장되며 GitHub에는 포함되지 않습니다.</p><label for="apiKey">NVIDIA API Key</label><input id="apiKey" type="password" autocomplete="off" placeholder="nvapi-..."><label for="apiEndpoint">API 연결 주소</label><input id="apiEndpoint" type="url" autocomplete="off" placeholder="Cloudflare Worker 주소 또는 기본 NVIDIA 주소"><label for="systemPrompt">기본 지시문 (선택)</label><input id="systemPrompt" autocomplete="off" placeholder="예: 항상 한국어로 간결하게 답변하세요."><div class="dialog-actions"><button class="plain" id="closeDialog" type="button">취소</button><button class="solid" id="saveKey" type="button">저장</button></div></dialog>
  <dialog id="historyDialog"><h2>대화 기록</h2><p>이 기기에 저장된 이전 대화입니다.</p><nav class="mobile-history-list" id="mobileHistory"></nav><div class="dialog-actions"><button class="plain" id="closeHistory" type="button">닫기</button><button class="solid" id="historyNew" type="button">새 대화</button></div></dialog>
  <script>
    const API_URL='https://integrate.api.nvidia.com/v1/chat/completions', MODEL='google/gemma-4-31b-it';
    const $=s=>document.querySelector(s), store={get:(k,d)=>JSON.parse(localStorage.getItem(k)||JSON.stringify(d)),set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
    let chats=store.get('gemmaChats',[]), activeId=localStorage.getItem('gemmaActive')||'', busy=false;
    const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    function applyTheme(t){document.documentElement.dataset.theme=t;localStorage.setItem('gemmaTheme',t);document.querySelector('meta[name="theme-color"]').content=t==='light'?'#f7f7f5':'#171717';$('#themeToggle').textContent=t==='light'?'☾':'☼';}
    applyTheme(localStorage.getItem('gemmaTheme')||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark'));
    $('#themeToggle').onclick=()=>applyTheme(document.documentElement.dataset.theme==='light'?'dark':'light');
    const current=()=>chats.find(c=>c.id===activeId); function persist(){store.set('gemmaChats',chats);localStorage.setItem('gemmaActive',activeId);renderHistory();renderMobileHistory();}
    function createChat(){const c={id:crypto.randomUUID(),title:'새 대화',messages:[],created:Date.now()};chats.unshift(c);activeId=c.id;persist();renderChat();$('#prompt').focus();}
    function selectChat(id){activeId=id;persist();renderChat();}
    function renderHistory(){$('#history').innerHTML=chats.map(c=>`<button class="row-button ${c.id===activeId?'active':''}" data-id="${c.id}" title="${esc(c.title)}">${esc(c.title)}</button>`).join('');$('#history').querySelectorAll('button').forEach(b=>b.onclick=()=>selectChat(b.dataset.id));}
    function renderMobileHistory(){$('#mobileHistory').innerHTML=chats.map(c=>`<button class="${c.id===activeId?'active':''}" data-id="${c.id}">${esc(c.title)}</button>`).join('');$('#mobileHistory').querySelectorAll('button').forEach(b=>b.onclick=()=>{selectChat(b.dataset.id);$('#historyDialog').close();});}
    function renderChat(){const c=current(),area=$('#chat');$('#title').textContent=c?.title||'새 대화';if(!c?.messages.length){area.innerHTML='<div class="empty"><div><div class="assistant-orb">BE</div><h1>무엇을 도와드릴까요?</h1><p>Black Eye와 대화를 시작해 보세요.</p><div class="suggestions"><button class="suggestion" data-prompt="오늘의 할 일을 우선순위별로 정리해줘">할 일 정리<small>오늘의 우선순위 만들기</small></button><button class="suggestion" data-prompt="이 주제를 초보자도 이해하게 설명해줘">쉽게 설명하기<small>복잡한 내용을 간단하게</small></button><button class="suggestion" data-prompt="아이디어를 5가지 제안해줘">아이디어 만들기<small>새로운 관점 찾기</small></button><button class="suggestion" data-prompt="아래 글을 핵심만 요약해줘: ">요약하기<small>긴 내용을 핵심만</small></button></div></div></div>';area.querySelectorAll('[data-prompt]').forEach(b=>b.onclick=()=>{$('#prompt').value=b.dataset.prompt;resize();$('#prompt').focus();});return;}area.innerHTML=c.messages.map(m=>`<div class="message ${m.role}"><div class="avatar">${m.role==='user'?'나':'AI'}</div><div class="bubble">${esc(m.content)}</div></div>`).join('')+(busy?'<div class="message assistant"><div class="avatar">AI</div><div class="bubble typing">생각 중입니다…</div></div>':'');area.scrollTop=area.scrollHeight;}
    function resize(){const p=$('#prompt');p.style.height='auto';p.style.height=Math.min(170,p.scrollHeight)+'px';}
    async function send(){const content=$('#prompt').value.trim(),chat=current();if(!content||busy)return;const key=localStorage.getItem('nvidiaApiKey');if(!key){openSettings();return;}if(location.protocol==='file:'){chat.messages.push({role:'assistant',content:'⚠️ 이 파일을 직접 열면 브라우저 보안 정책상 NVIDIA API에 연결할 수 없습니다.\n\nGitHub Pages처럼 HTTPS 주소에 올린 뒤 열어 주세요. API 키와 대화는 여전히 이 브라우저에만 저장됩니다.'});persist();renderChat();return;}chat.messages.push({role:'user',content});if(chat.messages.length===1)chat.title=content.slice(0,36);$('#prompt').value='';resize();busy=true;persist();renderChat();const sys=localStorage.getItem('gemmaSystem')||'',messages=[...(sys?[{role:'system',content:sys}]:[]),...chat.messages.map(({role,content})=>({role,content}))],endpoint=localStorage.getItem('nvidiaEndpoint')||API_URL;try{const r=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key,'Accept':'application/json'},body:JSON.stringify({model:MODEL,messages,chat_template_kwargs:{enable_thinking:true},temperature:1,top_p:.95,max_tokens:16384,stream:false})}),data=await r.json();if(!r.ok)throw new Error(data?.detail||data?.message||`요청 실패 (${r.status})`);const answer=data?.choices?.[0]?.message?.content;if(!answer)throw new Error('응답에서 답변을 찾지 못했습니다.');chat.messages.push({role:'assistant',content:answer});}catch(e){const note=e instanceof TypeError?'NVIDIA API가 GitHub Pages의 브라우저 직접 요청을 차단했습니다(CORS). API 키 오류가 아닐 수 있습니다.\n\nREADME의 Cloudflare Worker를 배포한 뒤, AI 설정의 「API 연결 주소」에 Worker 주소를 넣어 주세요.':e.message;chat.messages.push({role:'assistant',content:'⚠️ 연결 오류: '+note});}finally{busy=false;persist();renderChat();}}
    function openSettings(){$('#apiKey').value=localStorage.getItem('nvidiaApiKey')||'';$('#apiEndpoint').value=localStorage.getItem('nvidiaEndpoint')||API_URL;$('#systemPrompt').value=localStorage.getItem('gemmaSystem')||'';$('#keyDialog').showModal();}
    $('#newChat').onclick=createChat;$('#mobileNew').onclick=createChat;$('#bottomNew').onclick=createChat;$('#settings').onclick=openSettings;$('#mobileSettings').onclick=openSettings;$('#bottomSettings').onclick=openSettings;$('#historyToggle').onclick=()=>{$('#historyDialog').showModal();renderMobileHistory();};$('#closeHistory').onclick=()=>$('#historyDialog').close();$('#historyNew').onclick=()=>{createChat();$('#historyDialog').close();};$('#closeDialog').onclick=()=>$('#keyDialog').close();$('#saveKey').onclick=()=>{const k=$('#apiKey').value.trim(),e=$('#apiEndpoint').value.trim();if(k)localStorage.setItem('nvidiaApiKey',k);else localStorage.removeItem('nvidiaApiKey');if(e)localStorage.setItem('nvidiaEndpoint',e);else localStorage.removeItem('nvidiaEndpoint');localStorage.setItem('gemmaSystem',$('#systemPrompt').value.trim());$('#keyDialog').close();};$('#clearAll').onclick=()=>{if(confirm('모든 대화를 삭제할까요?')){chats=[];activeId='';persist();createChat();}};$('#form').onsubmit=e=>{e.preventDefault();send();};$('#prompt').oninput=resize;$('#prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}};
    if(!current())createChat();else{renderHistory();renderChat();}resize();if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js').catch(()=>{}));
  </script>
</body>
</html>
